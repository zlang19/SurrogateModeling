<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Surrogate Dashboard</title>
<script src="/static/plotly-basic.min.js"></script>
<style>
:root {
  color-scheme: light;
  --bg: #f4f4f2; --surface: #fcfcfb; --border: #e3e2dd; --grid: #ebeae6;
  --text: #0b0b0b; --text-2: #52514e; --muted: #8a897f;
  --accent: #2a78d6;
  --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
  --s0: #2a78d6; --s1: #eb6834; --s2: #1baf7a; --s3: #eda100;
  --s4: #e87ba4; --s5: #008300; --s6: #4a3aa7; --s7: #e34948;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #121211; --surface: #1a1a19; --border: #2e2e2b; --grid: #262624;
    --text: #ffffff; --text-2: #c3c2b7; --muted: #8d8c84; --accent: #3987e5;
    --s0: #3987e5; --s1: #d95926; --s2: #199e70; --s3: #c98500;
    --s4: #d55181; --s5: #008300; --s6: #9085e9; --s7: #e66767;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121211; --surface: #1a1a19; --border: #2e2e2b; --grid: #262624;
  --text: #ffffff; --text-2: #c3c2b7; --muted: #8d8c84; --accent: #3987e5;
  --s0: #3987e5; --s1: #d95926; --s2: #199e70; --s3: #c98500;
  --s4: #d55181; --s5: #008300; --s6: #9085e9; --s7: #e66767;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
}
main { max-width: 1600px; margin: 0 auto; padding: 16px; }
h1 { font-size: 17px; font-weight: 600; margin: 0; }
h2 { font-size: 13px; font-weight: 600; margin: 0 0 8px; color: var(--text-2); text-transform: uppercase; letter-spacing: .04em; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; }
.row { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
.muted { color: var(--muted); }
.sub { color: var(--text-2); }
select, input[type=text] {
  font: inherit; color: var(--text); background: var(--surface);
  border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px;
}
label { color: var(--text-2); display: inline-flex; gap: 6px; align-items: center; }

/* header */
header { display: grid; gap: 12px; margin-bottom: 12px; }
.pill { display: inline-flex; gap: 6px; align-items: center; padding: 2px 9px; border: 1px solid var(--border); border-radius: 999px; font-size: 12px; color: var(--text-2); }
.progress { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--grid); gap: 2px; }
.progress > div { height: 100%; }
.eta { font-variant-numeric: tabular-nums; }

/* state badges: color + icon + label, never color alone */
.st { display: inline-flex; gap: 5px; align-items: center; white-space: nowrap; }
.st::before { font-size: 11px; }
.st-done::before { content: "✓"; color: var(--good); }
.st-running::before { content: "●"; color: var(--accent); }
.st-queued::before { content: "◷"; color: var(--muted); }
.st-failed::before { content: "✕"; color: var(--critical); }
.st-stale::before { content: "⚠"; color: var(--serious); }
.st-not_scheduled::before { content: "–"; color: var(--muted); }

/* legend / method filter */
.chip { display: inline-flex; gap: 6px; align-items: center; padding: 3px 10px; border: 1px solid var(--border); border-radius: 999px; cursor: pointer; user-select: none; font-size: 13px; color: var(--text); background: var(--surface); }
.chip .dot { width: 10px; height: 10px; border-radius: 50%; }
.chip.off { color: var(--muted); }
.chip.off .dot { opacity: .25; }

/* plots */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 460px), 1fr)); gap: 12px; margin: 12px 0; }
.panel { min-height: 300px; }
.panel .plot { height: 280px; }
.panel-title { font-weight: 600; font-size: 13px; }

/* runs table */
.table-wrap { overflow-x: auto; max-height: 520px; overflow-y: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; font-size: 13px; }
th, td { text-align: left; padding: 5px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
th { position: sticky; top: 0; background: var(--surface); color: var(--text-2); font-weight: 600; cursor: pointer; }
th.sorted::after { content: " ▾"; } th.sorted.asc::after { content: " ▴"; }
tbody tr { cursor: pointer; }
tbody tr:hover { background: var(--bg); }
tr.flag td { background: color-mix(in srgb, var(--critical) 8%, transparent); }
td.num, th.num { text-align: right; }

/* run detail drawer */
.drawer { position: fixed; inset: 0 0 0 auto; width: min(760px, 100%); background: var(--surface); border-left: 1px solid var(--border); box-shadow: -8px 0 24px rgba(0,0,0,.18); transform: translateX(100%); transition: transform .18s ease; z-index: 10; overflow-y: auto; padding: 16px; }
.drawer.open { transform: none; }
.drawer .close { float: right; font: inherit; background: none; border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 2px 10px; cursor: pointer; }
pre { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 10px; overflow: auto; font-size: 12px; max-height: 360px; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 3px 14px; font-size: 13px; }
.kv dt { color: var(--text-2); } .kv dd { margin: 0; }
.err { color: var(--critical); }
</style>
</head>
<body>
<main>
  <header class="card">
    <div class="row">
      <h1>Surrogate test bed</h1>
      <label>Experiment <select id="exp"></select></label>
      <span id="services" class="row"></span>
      <span class="muted" id="updated"></span>
    </div>
    <div class="progress" id="progress" role="img" aria-label="run progress"></div>
    <div class="row sub" id="counts"></div>
  </header>

  <section class="card">
    <div class="row">
      <label>Metric
        <select id="metric">
          <option value="nrmse">NRMSE</option><option value="coverage">95% coverage</option>
          <option value="nll">NLL</option><option value="max_error">Max error</option>
        </select>
      </label>
      <label>X axis
        <select id="xaxis"><option value="cost">Cost (HF runs)</option><option value="elapsed">Wall time (s)</option></select>
      </label>
      <label><input type="checkbox" id="seeds"> Individual seeds</label>
      <span class="muted">Median line, IQR band across seeds · click a method to hide it</span>
    </div>
    <div class="row" id="legend" style="margin-top:10px"></div>
  </section>

  <section class="grid" id="panels"></section>

  <section class="card">
    <div class="row" style="justify-content: space-between; margin-bottom: 8px">
      <h2 style="margin:0">Runs</h2>
      <div class="row">
        <label>State <select id="stateFilter"><option value="">all</option></select></label>
        <input type="text" id="runFilter" placeholder="filter problem / method…">
      </div>
    </div>
    <div class="table-wrap"><table id="runs"><thead></thead><tbody></tbody></table></div>
  </section>
</main>

<aside class="drawer" id="drawer" aria-hidden="true">
  <button class="close" id="closeDrawer">Close</button>
  <h2 id="dTitle" style="font-size:15px;text-transform:none;letter-spacing:0;color:var(--text)"></h2>
  <dl class="kv" id="dInfo"></dl>
  <div id="dPlot" style="height:260px;margin-top:10px"></div>
  <h2 style="margin-top:12px">Batches <span class="muted" style="text-transform:none">· click a batch to see its diagnostics</span></h2>
  <div class="table-wrap" style="max-height:220px"><table id="dRows"><thead></thead><tbody></tbody></table></div>
  <h2 style="margin-top:12px" id="dDiagTitle">Diagnostics</h2>
  <pre id="dDiag">—</pre>
</aside>

<script>
"use strict";
const POLL_MS = 5000;
const STATES = ["done", "running", "queued", "failed", "stale", "not_scheduled"];
const STATE_LABEL = { done: "done", running: "running", queued: "queued", failed: "failed", stale: "stale", not_scheduled: "not scheduled" };
const STATE_VAR = { done: "--good", running: "--accent", queued: "--muted", failed: "--critical", stale: "--serious", not_scheduled: "--border" };

const store = {
  get(k, d) { try { const v = localStorage.getItem("sm:" + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("sm:" + k, JSON.stringify(v)); } catch {} },
};
const state = {
  exp: store.get("exp", null), metric: store.get("metric", "nrmse"), x: store.get("x", "cost"),
  seeds: store.get("seeds", false), hidden: new Set(store.get("hidden", [])),
  sort: store.get("sort", { key: "state", asc: true }), stateFilter: "", runFilter: "",
  info: null, openRun: null, openBatch: null,
};
const $ = (id) => document.getElementById(id);
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const color = (i) => css(i >= 0 ? `--s${i % 8}` : "--muted");

async function getJSON(url) {
  const r = await fetch(url, { cache: "no-store" });
  const body = await r.json();
  if (!r.ok) throw new Error(body.error || r.statusText);
  return body;
}
function fmtDur(s) {
  if (s === null || s === undefined) return "—";
  s = Math.round(s);
  if (s < 60) return `${s}s`;
  const m = Math.floor(s / 60), h = Math.floor(m / 60);
  return h ? `${h}h ${m % 60}m` : `${m}m ${s % 60}s`;
}
const fmt = (v, d = 3) => (v === null || v === undefined || Number.isNaN(v)) ? "—" : Number(v).toFixed(d);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* ---------- header ---------- */
async function loadExperiments() {
  const exps = await getJSON("/api/experiments");
  const sel = $("exp");
  const current = state.exp && exps.some((e) => e.name === state.exp) ? state.exp : (exps.find((e) => e.live) || exps[exps.length - 1] || {}).name;
  sel.innerHTML = exps.map((e) => `<option value="${esc(e.name)}">${e.live ? "● " : ""}${esc(e.name)} (${e.done} done)</option>`).join("");
  if (current) { sel.value = current; state.exp = current; }
}
function renderHeader(info) {
  $("services").innerHTML = info.services.length
    ? info.services.map((s) => `<span class="pill"><span class="st st-${s.sub === "running" ? "running" : s.active === "failed" ? "failed" : "not_scheduled"}"></span>${esc(s.unit.replace(".service", ""))} · ${esc(s.sub)}</span>`).join("")
    : `<span class="pill">no sm-* services</span>`;
  const total = info.total || 1;
  $("progress").innerHTML = STATES.filter((s) => info.counts[s])
    .map((s) => `<div title="${STATE_LABEL[s]}: ${info.counts[s]}" style="width:${(100 * info.counts[s]) / total}%;background:var(${STATE_VAR[s]})"></div>`).join("");
  const parts = STATES.filter((s) => info.counts[s]).map((s) => `<span class="st st-${s}">${info.counts[s]} ${STATE_LABEL[s]}</span>`);
  const pending = (info.counts.running || 0) + (info.counts.queued || 0);
  const eta = pending ? `ETA ${info.eta_partial ? "≥ " : ""}${fmtDur(info.eta)}` + (info.workers ? ` on ${info.workers} workers` : "") : "nothing pending";
  $("counts").innerHTML = parts.join("") + `<span class="eta"><b>${eta}</b></span>`;
  $("updated").textContent = "updated " + new Date().toLocaleTimeString();
}

/* ---------- legend / filter ---------- */
function renderLegend(info) {
  $("legend").innerHTML = info.methods.map((m) =>
    `<span class="chip ${state.hidden.has(m.name) ? "off" : ""}" data-m="${esc(m.name)}" role="button" aria-pressed="${!state.hidden.has(m.name)}">` +
    `<span class="dot" style="background:${color(m.index)}"></span>${esc(m.name)}</span>`).join("");
}
$("legend").addEventListener("click", (e) => {
  const chip = e.target.closest(".chip"); if (!chip) return;
  const m = chip.dataset.m;
  state.hidden.has(m) ? state.hidden.delete(m) : state.hidden.add(m);
  store.set("hidden", [...state.hidden]);
  renderLegend(state.info); refreshPlots();
});

/* ---------- plot panels ---------- */
function axisStyle() {
  return { gridcolor: css("--grid"), linecolor: css("--border"), zeroline: false, tickfont: { color: css("--muted"), size: 11 }, titlefont: { color: css("--text-2"), size: 12 } };
}
function baseLayout(extra) {
  return Object.assign({
    margin: { l: 56, r: 12, t: 8, b: 40 }, paper_bgcolor: "rgba(0,0,0,0)", plot_bgcolor: "rgba(0,0,0,0)",
    font: { family: "system-ui, sans-serif", color: css("--text") }, showlegend: false, hovermode: "x unified",
    hoverlabel: { bgcolor: css("--surface"), bordercolor: css("--border"), font: { color: css("--text"), size: 12 } },
  }, extra);
}
/* Log axes: explicit 1-2-5 ticks over the data range instead of Plotly's crowded minor digits. */
function logTicks(values) {
  const v = values.filter((x) => x > 0 && Number.isFinite(x));
  if (!v.length) return {};
  const lo = Math.min(...v), hi = Math.max(...v);
  const ticks = [];
  for (let e = Math.floor(Math.log10(lo)); e <= Math.ceil(Math.log10(hi)); e++)
    for (const m of [1, 2, 5]) { const t = m * 10 ** e; if (t >= lo / 1.5 && t <= hi * 1.5) ticks.push(t); }
  return { tickmode: "array", tickvals: ticks, ticktext: ticks.map((t) => Number(t.toPrecision(2)).toString()) };
}
const METRIC_LABEL = { nrmse: "NRMSE", coverage: "95% coverage", nll: "NLL", max_error: "Max error / std" };
const logY = (m) => m === "nrmse" || m === "max_error";

function tracesFor(curves) {
  const traces = [];
  for (const m of curves.methods) {
    const c = color(m.index);
    traces.push({ x: m.x, y: m.q75, mode: "lines", line: { width: 0 }, hoverinfo: "skip", type: "scatter" });
    traces.push({ x: m.x, y: m.q25, mode: "lines", line: { width: 0 }, fill: "tonexty", fillcolor: c + "2e", hoverinfo: "skip", type: "scatter" });
    if (m.seed_lines) for (const s of m.seed_lines)
      traces.push({ x: s.x, y: s.y, mode: "lines", line: { width: 1, color: c }, opacity: 0.35, hoverinfo: "skip", type: "scatter", line_shape: "hv" });
    traces.push({
      x: m.x, y: m.median, mode: "lines", line: { width: 2, color: c, shape: "hv" }, name: m.method, type: "scatter",
      customdata: m.n, hovertemplate: `${m.method}: %{y:.3g} <span style="color:${css("--muted")}">(n=%{customdata})</span><extra></extra>`,
    });
  }
  return traces;
}
async function refreshPlots() {
  const info = state.info; if (!info) return;
  const panels = $("panels");
  const keys = Object.entries(info.problems).flatMap(([p, outs]) => outs.map((o) => [p, o]));
  const want = keys.map(([p, o]) => `${p}:${o}`).join("|");
  if (panels.dataset.keys !== want) {
    panels.innerHTML = keys.map(([p, o]) => `<div class="card panel"><div class="panel-title">${esc(p)} <span class="sub">· ${esc(o)}</span></div><div class="plot" id="plot-${esc(p)}-${esc(o)}"></div></div>`).join("");
    panels.dataset.keys = want;
  }
  const methods = info.methods.map((m) => m.name).filter((m) => !state.hidden.has(m));
  await Promise.all(keys.map(async ([p, o]) => {
    const el = $(`plot-${p}-${o}`);
    if (!methods.length) { Plotly.react(el, [], baseLayout({})); return; }
    const q = new URLSearchParams({ name: state.exp, problem: p, output: o, metric: state.metric, x: state.x, seeds: state.seeds ? "1" : "0", methods: methods.join(",") });
    const curves = await getJSON("/api/curves?" + q);
    const ys = curves.methods.flatMap((m) => [...m.q25, ...m.q75, ...m.median, ...(m.seed_lines || []).flatMap((l) => l.y)]);
    const xs = curves.methods.flatMap((m) => m.x);
    const yaxis = Object.assign(axisStyle(), { title: { text: METRIC_LABEL[state.metric] }, type: logY(state.metric) ? "log" : "linear" }, logY(state.metric) ? logTicks(ys) : {});
    const xaxis = Object.assign(axisStyle(), { title: { text: state.x === "cost" ? "Cost (HF runs)" : "Wall time (s)" }, type: "log" }, logTicks(xs));
    const shapes = state.metric === "coverage" ? [{ type: "line", xref: "paper", x0: 0, x1: 1, y0: 0.95, y1: 0.95, line: { color: css("--muted"), width: 1, dash: "dot" } }] : [];
    const layout = baseLayout({ xaxis, yaxis, shapes, uirevision: `${state.exp}|${state.metric}|${state.x}` });
    if (!curves.methods.length) layout.annotations = [{ text: state.x === "elapsed" ? "no wall-time data (older runs)" : "no data", showarrow: false, xref: "paper", yref: "paper", x: 0.5, y: 0.5, font: { color: css("--muted") } }];
    Plotly.react(el, tracesFor(curves), layout, { displayModeBar: false, responsive: true });
  }));
}

/* ---------- runs table ---------- */
const COLS = [
  { key: "problem", label: "Problem" }, { key: "method", label: "Method" }, { key: "seed", label: "Seed", num: true },
  { key: "state", label: "State" }, { key: "cost", label: "Cost / budget", num: true }, { key: "batches", label: "Batches", num: true },
  { key: "elapsed", label: "Elapsed", num: true }, { key: "eta", label: "ETA", num: true }, { key: "heartbeat_age", label: "Heartbeat", num: true },
];
const STATE_ORDER = { running: 0, stale: 1, failed: 2, queued: 3, not_scheduled: 4, done: 5 };
function renderRuns(info) {
  const sel = $("stateFilter");
  const present = STATES.filter((s) => info.counts[s]);
  const opts = `<option value="">all</option>` + present.map((s) => `<option value="${s}">${STATE_LABEL[s]} (${info.counts[s]})</option>`).join("");
  if (sel.innerHTML !== opts) { sel.innerHTML = opts; sel.value = present.includes(state.stateFilter) ? state.stateFilter : ""; }
  const f = state.runFilter.toLowerCase();
  let rows = info.runs.filter((r) => (!state.stateFilter || r.state === state.stateFilter) && (!f || `${r.problem} ${r.method}`.toLowerCase().includes(f)));
  const { key, asc } = state.sort;
  const val = (r) => key === "state" ? STATE_ORDER[r.state] : r[key];
  rows.sort((a, b) => { const x = val(a), y = val(b); if (x === y) return 0; if (x === null || x === undefined) return 1; if (y === null || y === undefined) return -1; return (x < y ? -1 : 1) * (asc ? 1 : -1); });
  $("runs").querySelector("thead").innerHTML = "<tr>" + COLS.map((c) => `<th data-k="${c.key}" class="${c.num ? "num" : ""} ${key === c.key ? "sorted" + (asc ? " asc" : "") : ""}">${c.label}</th>`).join("") + "</tr>";
  $("runs").querySelector("tbody").innerHTML = rows.map((r) => {
    const hb = r.state === "running" || r.state === "stale" ? fmtDur(r.heartbeat_age) + " ago" : "—";
    return `<tr data-run="${esc(r.run)}" class="${r.state === "failed" || r.state === "stale" ? "flag" : ""}" title="${esc(r.error || "")}">` +
      `<td>${esc(r.problem)}</td><td><span class="dot" style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${color(info.methods.find((m) => m.name === r.method)?.index ?? -1)};margin-right:6px"></span>${esc(r.method)}</td>` +
      `<td class="num">${r.seed}</td><td><span class="st st-${r.state}">${STATE_LABEL[r.state]}</span></td>` +
      `<td class="num">${fmt(r.cost, 1)} / ${fmt(r.budget, 0)}</td><td class="num">${r.batches ?? "—"}</td>` +
      `<td class="num">${fmtDur(r.elapsed)}</td><td class="num">${r.state === "running" ? fmtDur(r.eta) : "—"}</td><td class="num">${hb}</td></tr>`;
  }).join("") || `<tr><td colspan="${COLS.length}" class="muted">no runs match</td></tr>`;
}
$("runs").addEventListener("click", (e) => {
  const th = e.target.closest("th");
  if (th) { const k = th.dataset.k; state.sort = { key: k, asc: state.sort.key === k ? !state.sort.asc : true }; store.set("sort", state.sort); renderRuns(state.info); return; }
  const tr = e.target.closest("tr[data-run]"); if (tr) openRun(tr.dataset.run);
});
$("stateFilter").addEventListener("change", (e) => { state.stateFilter = e.target.value; renderRuns(state.info); });
$("runFilter").addEventListener("input", (e) => { state.runFilter = e.target.value; renderRuns(state.info); });

/* ---------- run detail ---------- */
async function openRun(rid) {
  state.openRun = rid; state.openBatch = null;
  history.replaceState(null, "", "#run=" + encodeURIComponent(rid));
  $("drawer").classList.add("open"); $("drawer").setAttribute("aria-hidden", "false");
  await refreshRun();
}
async function refreshRun() {
  if (!state.openRun) return;
  const d = await getJSON("/api/run?" + new URLSearchParams({ name: state.exp, run: state.openRun }));
  const r = d.run;
  $("dTitle").textContent = state.openRun.replaceAll("__", " · ");
  const info = [["State", `<span class="st st-${r.state}">${STATE_LABEL[r.state] || r.state}</span>`], ["Cost", `${fmt(r.cost, 2)} / ${fmt(r.budget, 0)}`],
    ["Batches", r.batches ?? "—"], ["Elapsed", fmtDur(r.elapsed)]];
  if (r.error) info.push(["Error", `<span class="err">${esc(r.error)}</span>`]);
  $("dInfo").innerHTML = info.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("");

  const rows = d.rows, n = (rows.cost || []).length;
  const metricCols = Object.keys(rows).filter((k) => k.startsWith(state.metric + "/"));
  // Series here are outputs, not methods: take the first palette slots in order.
  const traces = metricCols.map((k, i) => ({ x: rows[state.x] || rows.cost, y: rows[k], mode: "lines+markers", marker: { size: 5 }, line: { width: 2, shape: "hv", color: color(i) }, name: k.split("/")[1], type: "scatter" }));
  const dys = metricCols.flatMap((k) => rows[k]);
  Plotly.react("dPlot", traces, baseLayout({ showlegend: metricCols.length > 1, legend: { orientation: "h", y: 1.12 },
    xaxis: Object.assign(axisStyle(), { type: "log", title: { text: state.x === "cost" ? "Cost" : "Wall time (s)" } }, logTicks(rows[state.x] || rows.cost || [])),
    yaxis: Object.assign(axisStyle(), { type: logY(state.metric) ? "log" : "linear", title: { text: METRIC_LABEL[state.metric] } }, logY(state.metric) ? logTicks(dys) : {}) }), { displayModeBar: false, responsive: true });

  const cols = ["batch", "n_evals", "cost", "elapsed", "sim_time", "predict_time", ...metricCols].filter((c) => rows[c]);
  $("dRows").querySelector("thead").innerHTML = "<tr>" + cols.map((c) => `<th class="num">${esc(c)}</th>`).join("") + "</tr>";
  $("dRows").querySelector("tbody").innerHTML = Array.from({ length: n }, (_, i) => `<tr data-i="${i}">` + cols.map((c) => `<td class="num">${c === "batch" || c === "n_evals" ? rows[c][i] : fmt(rows[c][i], c.includes("/") ? 4 : 2)}</td>`).join("") + "</tr>").reverse().join("");
  const bi = state.openBatch ?? n - 1;
  $("dDiagTitle").textContent = n ? `Diagnostics · batch ${bi}` : "Diagnostics";
  $("dDiag").textContent = n && d.diagnostics[bi] ? JSON.stringify(d.diagnostics[bi], (k, v) => typeof v === "number" ? Number(v.toPrecision(4)) : v, 2) : "— (none recorded for this run)";
}
$("dRows").addEventListener("click", (e) => { const tr = e.target.closest("tr[data-i]"); if (tr) { state.openBatch = Number(tr.dataset.i); refreshRun(); } });
$("closeDrawer").addEventListener("click", () => { state.openRun = null; history.replaceState(null, "", location.pathname + location.search); $("drawer").classList.remove("open"); $("drawer").setAttribute("aria-hidden", "true"); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") $("closeDrawer").click(); });

/* ---------- controls + polling ---------- */
$("metric").value = state.metric; $("xaxis").value = state.x; $("seeds").checked = state.seeds;
$("metric").addEventListener("change", (e) => { state.metric = e.target.value; store.set("metric", state.metric); refreshPlots(); refreshRun(); });
$("xaxis").addEventListener("change", (e) => { state.x = e.target.value; store.set("x", state.x); refreshPlots(); refreshRun(); });
$("seeds").addEventListener("change", (e) => { state.seeds = e.target.checked; store.set("seeds", state.seeds); refreshPlots(); });
$("exp").addEventListener("change", (e) => { state.exp = e.target.value; store.set("exp", state.exp); $("panels").dataset.keys = ""; tick(); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { renderLegend(state.info); refreshPlots(); renderRuns(state.info); });

let busy = false;
async function tick() {
  if (busy || document.hidden) return;
  busy = true;
  try {
    await loadExperiments();
    if (!state.exp) return;
    store.set("exp", state.exp);
    state.info = await getJSON("/api/experiment?" + new URLSearchParams({ name: state.exp }));
    renderHeader(state.info); renderLegend(state.info); renderRuns(state.info);
    await refreshPlots();
    if (state.openRun) await refreshRun();
  } catch (err) {
    $("updated").innerHTML = `<span class="err">⚠ ${esc(err.message)}</span>`;
  } finally { busy = false; }
}
const params = new URLSearchParams(location.search);
if (params.get("exp")) state.exp = params.get("exp");
tick().then(() => { if (location.hash.startsWith("#run=")) openRun(decodeURIComponent(location.hash.slice(5))); });
setInterval(tick, POLL_MS);
document.addEventListener("visibilitychange", () => { if (!document.hidden) tick(); });
</script>
</body>
</html>
